version: "3.9"
services:
  api:
    image: home-library:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: api_dev_c
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - library-network

networks:
  library-network:
    driver: bridge
