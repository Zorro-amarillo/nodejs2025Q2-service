openapi: 3.0.0
paths:
  /user:
    get:
      operationId: UserController_getAll
      summary: Get all users
      parameters: []
      responses:
        '200':
          description: List of users
      tags:
        - 👤 Users
    post:
      operationId: UserController_create
      summary: Create user
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created
        '400':
          description: 'User not created: request body does not contain required fields'
      tags:
        - 👤 Users
  /user/{id}:
    get:
      operationId: UserController_getById
      summary: Get single user by id
      parameters:
        - name: id
          required: true
          in: path
          description: uuid
          schema:
            type: string
      responses:
        '200':
          description: User found
        '400':
          description: 'User not found: userId is invalid (not uuid)'
        '404':
          description: 'User not found: record with id === userId doesn''t exist'
      tags:
        - 👤 Users
    put:
      operationId: UserController_update
      summary: Update user's password
      parameters:
        - name: id
          required: true
          in: path
          description: uuid
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordDto'
      responses:
        '200':
          description: Password updated
        '400':
          description: 'Password not updated: userId is invalid (not uuid)'
        '403':
          description: 'Password not updated: oldPassword is wrong'
        '404':
          description: 'Password not updated: record with id === userId doesn''t exist'
      tags:
        - 👤 Users
    delete:
      operationId: UserController_delete
      summary: Delete user
      parameters:
        - name: id
          required: true
          in: path
          description: uuid
          schema:
            type: string
      responses:
        '204':
          description: User deleted
        '400':
          description: 'User not deleted: userId is invalid (not uuid)'
        '404':
          description: 'User not deleted: record with id === userId doesn''t exist'
      tags:
        - 👤 Users
