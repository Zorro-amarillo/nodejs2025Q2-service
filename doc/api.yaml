info:
  title: Home Library Service
  description: REST API for Home Library Service
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  schemas:
    CreateUserDto:
      type: object
      properties:
        login:
          type: string
          example: TestUser
        password:
          type: string
          example: s3crEt
      required:
        - login
        - password
    UpdatePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
          example: oldPass
        newPassword:
          type: string
          example: newPass
      required:
        - oldPassword
        - newPassword
    CreateArtistDto:
      type: object
      properties:
        name:
          type: string
          example: TestArtist
        grammy:
          type: boolean
          example: true
      required:
        - name
        - grammy
    CreateAlbumDto:
      type: object
      properties:
        name:
          type: string
          example: TestAlbum
        year:
          type: number
          example: 2025
        artistId:
          type: string
          nullable: true
          format: uuid
          example: 8e611ac7-420a-42a9-8240-c49b91f93184
      required:
        - name
        - year
        - artistId
    CreateTrackDto:
      type: object
      properties:
        name:
          type: string
          example: TestTrack
        artistId:
          type: string
          nullable: true
          format: uuid
          example: 8e611ac7-420a-42a9-8240-c49b91f93184
        albumId:
          type: string
          nullable: true
          format: uuid
          example: 8e611ac7-420a-42a9-8240-c49b91f93183
        duration:
          type: number
          example: 120
      required:
        - name
        - artistId
        - albumId
        - duration